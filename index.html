<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Turn any picture into a sliding puzzle. Upload, crop, pick a grid size, scramble, and watch it solve itself." />
    <meta name="color-scheme" content="light dark" />
    <title>Slide Puzzle</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='13' height='13' rx='3' fill='%23d9507a'/%3E%3Crect x='17' y='2' width='13' height='13' rx='3' fill='%234a2a7a'/%3E%3Crect x='2' y='17' width='13' height='13' rx='3' fill='%23f9a65a'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Slide Puzzle</h1>
      </header>

      <div class="toolbar">
        <button id="upload" type="button">Upload picture</button>
        <input id="file" type="file" accept="image/*" hidden />
        <button id="recrop" type="button">Re-crop</button>
        <label class="size">
          <span>Grid</span>
          <select id="size" aria-label="Grid size"></select>
        </label>
      </div>

      <div id="board" class="board" aria-label="Puzzle board"></div>

      <div class="actions">
        <button id="scramble" type="button" class="primary">Scramble</button>
        <button id="solve" type="button" class="primary">Solve</button>
      </div>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <footer class="footer">Your picture stays on your device. Nothing is uploaded to a server.</footer>
    </main>

    <dialog id="crop-dialog" class="crop-dialog" aria-labelledby="crop-title">
      <h2 id="crop-title">Crop your picture</h2>
      <div class="crop-frame">
        <canvas id="crop-canvas" aria-label="Crop preview"></canvas>
      </div>
      <label class="zoom">
        <span aria-hidden="true">−</span>
        <input id="crop-zoom" type="range" aria-label="Zoom" />
        <span aria-hidden="true">+</span>
      </label>
      <p class="hint">Drag to move · scroll or pinch to zoom</p>
      <div class="dialog-actions">
        <button id="crop-cancel" type="button">Cancel</button>
        <button id="crop-done" type="button" class="primary">Done</button>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
